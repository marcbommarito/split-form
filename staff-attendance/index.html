  <script>
    (function(){
      var dateEl=document.getElementById('attendance_date');
      var timeEl=document.getElementById('attendance_time');
      function pad(n){return String(n).padStart(2,'0');}
      function syncFields(){
        if(dateEl.value){
          var dp=dateEl.value.split('-');
          document.getElementById('year_4').value=dp[0]||'';
          document.getElementById('month_4').value=dp[1]||'';
          document.getElementById('day_4').value=dp[2]||'';
        }
        if(timeEl.value){
          var tp=timeEl.value.split(':');
          var h24=parseInt(tp[0],10),min=tp[1]||'00';
          var ampm=h24>=12?'PM':'AM';
          var h12=h24%12||12;
          document.getElementById('input_5_timeInput').value=pad(h12)+':'+min;
          document.getElementById('input_5_hourSelect').value=pad(h12);
          document.getElementById('input_5_minuteSelect').value=min;
          document.getElementById('input_5_ampm').value=ampm;
        }
      }
      function setNow(){
        var d=new Date();
        dateEl.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
        timeEl.value=pad(d.getHours())+':'+pad(d.getMinutes());
        syncFields();
      }
      dateEl.addEventListener('change',syncFields);
      timeEl.addEventListener('change',syncFields);
      document.getElementById('261966694349072').addEventListener('submit',syncFields);
      setNow();
    })();
  </script>
